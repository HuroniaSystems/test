name: grp-dialer

on:
  push:
    paths:
      - 'grp-dialer/**'
      - '.github/workflows/grp-dialer.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub release with this tag (e.g. grp-dialer-v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test grp-dialer/tests/GrpDialer.Tests -c Release
      - name: Publish (single-file, self-contained, win-x64)
        run: >
          dotnet publish grp-dialer/src/GrpDialer/GrpDialer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o grp-dialer/publish
      - uses: actions/upload-artifact@v4
        with:
          name: GrpDialer-win-x64
          path: grp-dialer/publish/GrpDialer.exe
      - name: Create release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          $hash = (Get-FileHash grp-dialer/publish/GrpDialer.exe -Algorithm SHA256).Hash
          $notes = @"
          GRP Dialer for Windows 10/11. Controls a Grandstream GRP2634 over its CTI API: dial, answer, hang up.

          What's new in 1.4:
          - Caller lookup in PropelRx: for incoming calls, a small caption under the number says "Potentially JANE DOE" when one patient has that phone number, or "Multiple linked profiles" when several do. Nothing is shown when there's no match. Turn it on in Settings > Caller lookup with the PropelRx server (e.g. svr1), the same one OTC Monitor uses. It signs in as the current Windows user; a different account can be set under Advanced.

          New in 1.3:
          - Call bar: a thin strip the width of the dialer, above the clock, for every call. Ringing: green dot, number, Answer and Decline. Answered: orange dot, call time underneath, End. It stays up for the whole call, even when you click away, and never takes focus from what you're typing.
          - Number box formats as you type, e.g. (705) 555-1234, and ignores letters. Short extensions stay as typed.
          - Smaller placeholder text in the number box.
          - Call time on the dialer counts from when the call was answered.

          New in 1.2:
          - Lives in the tray by the clock, like OTC Monitor: no taskbar button. Click the tray icon to open the dialer above the taskbar; it hides when you click away (or press Esc / the X).
          - A queued call about to dial pops the dialer up (without stealing focus) so you can pause it.
          - Quit from the tray icon's right-click menu, or Settings > Advanced.
          - Windows 11 may put the icon under the ^ arrow at first: drag it onto the taskbar to keep it in view.

          New in 1.1:
          - Call queue: while on a call, type numbers and press Enter to line them up. When the call ends, the next one dials automatically after a short countdown. Pause, Resume, Clear, or remove single numbers.
          - New light design matching OTC Monitor: green header, white cards, Roboto.
          - Simpler screen: plain status words, keypad and technical details tucked into Settings.
          - Sturdier: rides out a dropped poll, second launch brings the open window up, errors are logged instead of crashing.

          Download GrpDialer.exe and run it. No install or .NET runtime needed.

          Phone setup: Network > Remote Control. Enable Action URI Support, add this PC's IP (or any) to the Allowed IP List, disable Remote Control Pop-up Window Support.

          SHA-256: $hash
          "@
          gh release create $env:TAG grp-dialer/publish/GrpDialer.exe `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "GRP Dialer $($env:TAG -replace '^grp-dialer-','')" --notes $notes
